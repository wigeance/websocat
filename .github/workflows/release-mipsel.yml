name: Build websocat (mipsel, Rust nightly 1.80)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show project structure
        run: |
          pwd
          ls -la
          find . -name Cargo.toml

      - name: Install Rust nightly 1.80
        run: |
          rustup toolchain install nightly-2024-04-01
          rustup target add mipsel-unknown-linux-musl --toolchain nightly-2024-04-01

      - name: Fetch dependencies
        run: cargo +nightly-2024-04-01 fetch

      - name: Build release
        run: cargo +nightly-2024-04-01 build --release --target mipsel-unknown-linux-musl -Z build-std=core,alloc,std,proc_macro

      - name: Inspect binary
        run: |
          ls -lh target/mipsel-unknown-linux-musl/release/
          file target/mipsel-unknown-linux-musl/release/websocat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: websocat-mipsel
          path: target/mipsel-unknown-linux-musl/release/websocat
