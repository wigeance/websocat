name: Build websocat (mipsel-musl, legacy toolchain)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (1.77, supports MIPS)
        uses: dtolnay/rust-toolchain@1.77.2
        with:
          targets: mipsel-unknown-linux-musl

      - name: Install musl cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-mipsel-linux-gnu

      - name: Configure Cargo linker
        run: |
          mkdir -p .cargo
          echo '[target.mipsel-unknown-linux-musl]' > .cargo/config.toml
          echo 'linker = "mipsel-linux-gnu-gcc"' >> .cargo/config.toml

      - name: Build release (static)
        run: cargo build --release --target mipsel-unknown-linux-musl

      - name: Strip binary
        run: mipsel-linux-gnu-strip target/mipsel-unknown-linux-musl/release/websocat

      - uses: actions/upload-artifact@v4
        with:
          name: websocat-mipsel-musl
          path: target/mipsel-unknown-linux-musl/release/websocat
