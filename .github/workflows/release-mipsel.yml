name: Build websocat (mipsel via cross build-std)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install latest cross (dev branch)
        run: |
          cargo install --git https://github.com/cross-rs/cross cross --force
          cross --version

      - name: Write Cross.toml
        run: |
          cat > Cross.toml <<'EOF'
          [target.mipsel-unknown-linux-musl]
          image = "ghcr.io/cross-rs/mipsel-unknown-linux-musl:edge"
          build-std = ["core", "alloc", "std", "proc_macro"]
          EOF

      - name: Show Cargo metadata (debug aid)
        run: cargo metadata --no-deps

      - name: Build release (mipsel)
        env:
          CROSS_DEBUG: 1
          CROSS_NO_WARNINGS: 1
        run: |
          cross build --release --target mipsel-unknown-linux-musl

      - name: Inspect result
        run: |
          ls -lh target/mipsel-unknown-linux-musl/release/ || true
          file target/mipsel-unknown-linux-musl/release/websocat || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: websocat-mipsel
          path: target/mipsel-unknown-linux-musl/release/websocat
