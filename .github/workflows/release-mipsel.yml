name: Build websocat (mipsel nightly via cross)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cross (latest dev)
        run: cargo install cross --git https://github.com/cross-rs/cross --force

      - name: Create Cross.toml
        run: |
          cat > Cross.toml <<'EOF'
          [target.mipsel-unknown-linux-musl]
          image = "ghcr.io/cross-rs/mipsel-unknown-linux-musl:edge"
          build-std = ["core", "alloc", "std", "proc_macro"]
          EOF

      - name: Build for MIPSEL (nightly)
        env:
          CROSS_NO_WARNINGS: 1
        run: cross build --release --target mipsel-unknown-linux-musl -Z build-std=std,core,alloc,proc_macro

      - name: Inspect result
        run: |
          ls -lh target/mipsel-unknown-linux-musl/release/ || true
          file target/mipsel-unknown-linux-musl/release/websocat || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: websocat-mipsel
          path: target/mipsel-unknown-linux-musl/release/websocat
