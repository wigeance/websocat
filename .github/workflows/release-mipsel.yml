name: Build websocat (mipsel via cross + vendored OpenSSL)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show project structure
        run: |
          pwd
          ls -la
          find . -name Cargo.toml

      - name: Setup nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --force

      - name: Create Cross.toml
        run: |
          cat > Cross.toml <<'EOF'
          [target.mipsel-unknown-linux-musl]
          image = "ghcr.io/cross-rs/mipsel-unknown-linux-musl:edge"
          build-std = ["core", "alloc", "std", "proc_macro"]
          EOF

      - name: Build release
        env:
          CROSS_NO_WARNINGS: 1
        run: cross build --release --target mipsel-unknown-linux-musl --features vendored-openssl -Z build-std=std,core,alloc,proc_macro

      - name: Inspect binary
        run: |
          ls -lh target/mipsel-unknown-linux-musl/release/
          file target/mipsel-unknown-linux-musl/release/websocat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: websocat-mipsel
          path: target/mipsel-unknown-linux-musl/release/websocat
