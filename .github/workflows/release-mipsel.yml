name: Build websocat (mipsel)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: mipsel-unknown-linux-gnu

      - name: Install mipsel toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu

      - name: Configure cargo linker
        run: |
          mkdir -p .cargo
          echo '[target.mipsel-unknown-linux-gnu]' > .cargo/config.toml
          echo 'linker = "mipsel-linux-gnu-gcc"' >> .cargo/config.toml

      - name: Build (release)
        run: cargo build --release --target mipsel-unknown-linux-gnu

      - name: Strip binary
        run: mipsel-linux-gnu-strip target/mipsel-unknown-linux-gnu/release/websocat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: websocat-mipsel
          path: target/mipsel-unknown-linux-gnu/release/websocat
