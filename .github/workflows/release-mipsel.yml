name: Build websocat (mipsel with nightly Rust)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show project structure
        run: |
          pwd
          ls -la
          find . -name Cargo.toml

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly
          rustup target add mipsel-unknown-linux-musl --toolchain nightly

      - name: Fetch dependencies
        run: cargo fetch

      - name: Build release
        env:
          CARGO_TERM_COLOR: always
        run: cargo +nightly build --release --target mipsel-unknown-linux-musl -Z build-std=core,alloc,std,proc_macro

      - name: Inspect binary
        run: |
          ls -lh target/mipsel-unknown-linux-musl/release/
          file target/mipsel-unknown-linux-musl/release/websocat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: websocat-mipsel
          path: target/mipsel-unknown-linux-musl/release/websocat
