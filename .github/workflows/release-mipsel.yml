name: Build websocat (mipsel via cross + vendored OpenSSL)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Клонируем репозиторий
      - name: Checkout source
        uses: actions/checkout@v4

      # 2️⃣ Устанавливаем nightly Rust (нужен для -Z build-std)
      - name: Setup nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # 3️⃣ Устанавливаем cross
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --force

      # 4️⃣ Создаём Cross.toml с указанием сборки std
      - name: Create Cross.toml
        run: |
          cat > Cross.toml <<'EOF'
          [target.mipsel-unknown-linux-musl]
          image = "ghcr.io/cross-rs/mipsel-unknown-linux-musl:edge"
          build-std = ["core", "alloc", "std", "proc_macro"]
          EOF

      # 5️⃣ Собираем websocat под mipsel с vendored OpenSSL
      - name: Build release (mipsel, vendored OpenSSL)
        env:
          CROSS_NO_WARNINGS: 1
        run: cross build --release --target mipsel-unknown-linux-musl --features=vendored-openssl -Z build-std=std,core,alloc,proc_macro

      # 6️⃣ Проверяем результат
      - name: Inspect binary
        run: |
          ls -lh target/mipsel-unknown-linux-musl/release/
          file target/mipsel-unknown-linux-musl/release/websocat

      # 7️⃣ Загружаем бинарник как артефакт
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: websocat-mipsel
          path: target/mipsel-unknown-linux-musl/release/websocat
