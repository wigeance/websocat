name: Build websocat (mipsel)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show project structure
        run: |
          pwd
          ls -la
          find . -name Cargo.toml

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --force

      - name: Create Cross.toml
        run: |
          cat > Cross.toml <<'EOF'
          [target.mipsel-unknown-linux-musl]
          image = "ghcr.io/cross-rs/mipsel-unknown-linux-musl:edge"
          EOF

      - name: Build release
        run: cross build --release --target mipsel-unknown-linux-musl

      - name: Inspect binary
        run: |
          ls -lh target/mipsel-unknown-linux-musl/release/
          file target/mipsel-unknown-linux-musl/release/websocat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: websocat-mipsel
          path: target/mipsel-unknown-linux-musl/release/websocat
