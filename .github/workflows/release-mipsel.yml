name: Build websocat (mipsel via cross)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Rust (latest)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build for mipsel (musl)
        run: cross build --release --target mipsel-unknown-linux-musl

      - name: Show binary info
        run: |
          file target/mipsel-unknown-linux-musl/release/websocat || true
          ls -lh target/mipsel-unknown-linux-musl/release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: websocat-mipsel
          path: target/mipsel-unknown-linux-musl/release/websocat
