name: Build websocat (mipsel-musl via cross, build-std)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Create Cross.toml (build std)
        run: |
          cat > Cross.toml <<'EOF'
          [target.mipsel-unknown-linux-musl]
          image = "ghcr.io/cross-rs/mipsel-unknown-linux-musl:edge"
          build-std = ["std", "core", "alloc", "proc_macro"]
          EOF

      - name: Build (release)
        run: cross build --release --target mipsel-unknown-linux-musl --features=vendored-openssl

      - name: Strip binary
        run: |
          file target/mipsel-unknown-linux-musl/release/websocat || true
          ls -lh target/mipsel-unknown-linux-musl/release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: websocat-mipsel
          path: target/mipsel-unknown-linux-musl/release/websocat
